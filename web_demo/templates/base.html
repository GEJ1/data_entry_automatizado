<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}CADMI (DEMO){% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    header { background: #1F4E79; color: #fff; padding: 10px 20px; display: flex;
             align-items: baseline; gap: 12px; }
    header .marca { font-weight: 700; }
    header .demo { background: #b03030; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
    main { padding: 20px; max-width: 1100px; }
    table { border-collapse: collapse; background: #fff; width: 100%; font-size: 13px; }
    th { background: #1F4E79; color: #fff; text-align: left; padding: 6px 8px; }
    td { border: 1px solid #d8dde3; padding: 5px 8px; }
    tr:nth-child(even) td { background: #fafbfc; }
    a { color: #1F4E79; }
    .vacio { color: #999; font-style: italic; }
    input[type=text] { padding: 5px; border: 1px solid #bbb; border-radius: 3px; }
    button { padding: 6px 14px; background: #1F4E79; color: #fff; border: 0;
             border-radius: 3px; cursor: pointer; }
    .aviso { background: #e6f4ea; border: 1px solid #9ccfae; padding: 8px 12px;
             margin-bottom: 14px; border-radius: 3px; }
    fieldset { background: #fff; border: 1px solid #d8dde3; margin-bottom: 14px; }
    legend { font-weight: 700; padding: 0 6px; }
    fieldset.prohibidos { border-color: #d9a3a3; background: #fff7f7; }
    .campo { display: flex; gap: 10px; align-items: center; margin: 6px 0; }
    .campo label { width: 180px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <span class="marca">CADMI · Solicitudes</span>
    <span class="demo">WEB DE DEMOSTRACIÓN · datos inventados</span>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
